# Deploy a Ceph cluster for ceph_dashboard_api_automation.
#
# Provisioning and topology stay on the existing run.py flags (--cloud,
# --global-conf, --inventory). This suite only bootstraps the cluster, pins
# the dashboard login, and writes dashboard_endpoint.json into the cephci log
# directory. It does not run pytest; run.py does that when --dashboard-pytest
# and --dashboard-marker are set.
#
# mon-ip is the installer node name from --global-conf. node1 matches the
# standard 1admin cephadm topologies. Point it at the installer node if the
# chosen topology uses a different name.
#
# Optional daemons (RGW, NFS, MDS, NVMe-oF, iSCSI) are the same deploy stage.
# Uncomment a step below and place it after OSDs and before
# "Export dashboard endpoint". The topology must already label nodes for that
# daemon. Those steps do not change how pytest is started.
---
tests:

  - test:
      abort-on-fail: true
      desc: "Install prerequisites for Ceph cluster deployment."
      module: install_prereq.py
      name: "test suite setup"

  - test:
      abort-on-fail: true
      config:
        args:
          mon-ip: node1
          initial-dashboard-user: admin
          initial-dashboard-password: admin@123
          dashboard-password-noupdate: true
        command: bootstrap
        service: cephadm
      desc: "Bootstrap the cluster with a pinned dashboard login."
      destroy-cluster: false
      module: test_bootstrap.py
      name: "Test cluster deployment using cephadm"

  - test:
      abort-on-fail: true
      config:
        args:
          attach_ip_address: true
          labels: apply-all-labels
        command: add_hosts
        service: host
      desc: "Adding hosts to the cluster using labels and IP information."
      destroy-cluster: false
      module: test_host.py
      name: "Test host add with labels and IP"

  - test:
      abort-on-fail: true
      config:
        args:
          all-available-devices: true
        command: apply
        service: osd
      desc: "Deploying OSD daemons using all-available-devices option."
      destroy-cluster: false
      module: test_osd.py
      name: "Test apply osd with all-available-devices option"

  # Optional daemon steps. Uncomment and keep them before the export step.
