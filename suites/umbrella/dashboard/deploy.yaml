  - test:
      abort-on-fail: true
      config:
        username: admin
        password: admin@123
        health-wait-seconds: 600
      desc: "Write dashboard host, port, user, and password for pytest."
      destroy-cluster: false
      module: export_dashboard_endpoint.py
      name: "Export dashboard endpoint"
